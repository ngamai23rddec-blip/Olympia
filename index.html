 <div class="card"><h3>Thiết lập</h3><select onchange="this.blur();save(x=>{x.mode=this.value;x.qi=-1;x.show=false;x.open=false;x.owner=null;x.banned=[];x.seq++})">${Object.entries(MODES).map(([k,v])=>`<option value="${k}" ${S.mode===k?'selected':''}>${v}</option>`)}</select>
 <label><input type="checkbox" style="width:auto" ${S.reset0?'checked':''} onchange="save(x=>x.reset0=this.checked)"> Chung kết bắt đầu lại từ 0 điểm (khuyến nghị)</label><br>
 <button class="btn alt" onclick="save(x=>x.result=!x.result);confetti()">Công bố kết quả</button><button class="btn no" onclick="if(confirm('Đặt lại phòng? Giữ câu hỏi, xóa điểm và đội, tạo mã phòng mới.'))save(x=>Object.assign(x,fresh(),{qs:x.qs,room:String(Math.floor(1000+Math.random()*9000))}))">Đặt lại phòng</button></div>`;
 else if(tab==='qs')body=qForm()+`<div class="card"><h3>Câu hỏi (${mq.length})</h3>${S.qs.map((x,i)=>x.m!==S.mode?'':`<div class="score qrow"><span class="qt"><b>${x.type}</b> · ${esc(x.t.slice(0,60))}</span><span class="qa"><label class="mini">Điểm <input type="number" min="0" value="${PT(x)}" onchange="setQ(${i},'pts',this.value)"></label><button class="btn alt" title="Lên" onclick="mv(${i},-1)">${ic('up')}</button><button class="btn alt" title="Xuống" onclick="mv(${i},1)">${ic('down')}</button><button class="btn alt" title="Sửa" onclick="editQ(${i})">${ic('edit')}</button><button class="btn no" title="Xóa" onclick="delQ(${i})">${ic('trash')}</button></span></div>`).join('')||'Chưa có câu hỏi'}</div>`;
 else if(tab==='room')body=`<div class="center">${lobbyCard()}<button class="btn" onclick="save(x=>x.phase=(x.phase==='setup'?'lobby':x.phase))">Hiện QR trên màn chiếu</button><button class="btn alt" onclick="window.open(BASE+'#display','_blank')">Mở Public Display</button></div>`;
 else if(tab==='ctl')body=ctlTab();
 else{const rk=rank().map(r=>r.i);body=`<div class="card"><h3>${ic('trophy')} Bảng điểm</h3><p class="hint">Nhập điểm rồi nhấn Enter (hoặc nút xác nhận), hoặc bấm −10 / +10 hai bên ô.</p>${teamsIn().map(i=>{const t=S.scores[i];return `<div class="srow"><span class="rk">${rk.indexOf(i)+1}</span><span class="tn"><b>${nm(i)}</b><small>V1 ${t.h} · CK1 ${t.f1} · CK2 ${t.f2}</small></span><span class="adj"><button class="pm" onclick="bump(${i},-10)">−10</button><input id="s${i}" type="number" value="${tot(t)}" onkeydown="if(event.key==='Enter')setTotal(${i})"><button class="pm" onclick="bump(${i},10)">+10</button><button class="pm ck" onclick="setTotal(${i})">${ic('check')}</button></span></div>`}).join('')}</div>`+`<div class="card"><h3>Lịch sử</h3><div style="max-height:320px;overflow:auto;font-size:.85em">${S.log.map(l=>l.manual?`${l.t} Chỉnh tay ${nm(l.team)}: ${l.d} (${esc(l.why)})`:`${l.t} Câu ${l.q} ${nm(l.team)} ${l.ok?'ĐÚNG':'SAI'} ${l.d>0?'+':''}${l.d}${l.steal?' (cướp)':''}`).join('<br>')}</div></div>`}
 return `<div class="shell">${side}<main>${body}</main></div>`}
function displayUI(){
 if(!S.room||S.phase==='setup')return `<div class="center" style="padding-top:20vh"><h1 class="logo" style="font-size:clamp(2.2rem,8vw,5rem)">OLYMPIA</h1><div class="sub">THE PINK CHALLENGE · KNOWLEDGE – SPEED – STRATEGY</div><p style="color:var(--mut)">MC đang chuẩn bị…</p></div>`;
 if(S.phase==='lobby')return `<div class="center"><h1 class="logo" style="font-size:clamp(1.8rem,5vw,3.4rem)">OLYMPIA · THE PINK CHALLENGE</h1>${lobbyCard()}</div>`;
 const qq=cq(),r=rank();
 if(S.result){const med=['Quán quân','Á quân','Hạng ba','Hạng tư'];return `<div class="center win">${r.map((x,i)=>`<div class="card big"><span class="rk">${i+1}</span> ${med[i]||''} · ${nm(x.i)} — ${x.t} điểm</div>`).join('')}</div>`}
 const pq=qq&&S.show?parseQ(qq.t):null,ok=a=>{const m=String(qq.a||'').trim().match(/^([A-D])\b/i);return m?m[1].toUpperCase()===a.k:false};
 const mq=S.qs.filter(x=>x.m===S.mode),P=qq?PT(qq):0;
 const ban=S.owner?`<div class="dbuzz on">${ic('bell')}<span><b>${nm(S.owner)}</b> đã giành quyền trả lời</span></div>`:S.open?`<div class="dbuzz on" style="color:var(--pk)">${ic('bell')} Chuông đã mở!</div>`:S.fx?`<div class="dbuzz on" style="color:${S.fx.k==='ok'?'var(--ok)':'var(--no)'}">${ic(S.fx.k==='ok'?'check':'x')} ${S.fx.k==='ok'?'ĐÚNG':'SAI'} ${S.fx.d>0?'+':''}${S.fx.d} · ${nm(S.fx.team)}</div>`:'<div class="dbuzz"></div>';
 return `<div class="dsp"><div class="dtop"><span class="pill">${MODES[S.mode]}</span>${S.star?`<span class="pill">${ic('star','f')} Ngôi sao ×2</span>`:''}<span id="dt" class="timer"></span></div>
 <div class="card dq">${pq?`<div class="dmeta"><span class="pill">Câu ${S.qi+1}/${mq.length}</span><span class="pill">${esc(qq.type)}</span><span class="pill pts">${P} điểm</span></div><div class="dstem ${pq.opts.length?'sm':''}">${esc(pq.stem).replace(/\n/g,'<br>')}</div>${qq.img?`<img class="q-img" src="${esc(qq.img)}">`:''}${pq.opts.length?`<div class="dopts">${pq.opts.map(o=>`<div class="dopt ${S.ans&&ok(o)?'right':''}"><i>${o.k}</i><span>${esc(o.t)}</span></div>`).join('')}</div>`:''}${S.ans?`<div class="dans">Đáp án: ${esc(qq.a)}</div><div class="dex">${esc(qq.ex)}</div>`:''}`:`<div class="dstem">Chuẩn bị…</div><div class="hint">${MODES[S.mode]}</div>`}</div>
 ${ban}<div class="tiles">${teamsIn().map(i=>`<div class="tile ${S.owner===i?'on':''}"><b class="n">${S.owner===i?ic('bell'):''} ${nm(i)}</b><b class="p">${tot(S.scores[i])}</b></div>`).join('')}</div>
 <div class="center"><button class="btn alt sm" onclick="document.documentElement.requestFullscreen()">${ic('full')} Toàn màn hình</button><button class="btn alt sm" onclick="snd=!snd;render()">${ic(snd?'vol':'mute')} Âm thanh: ${snd?'bật':'tắt'}</button></div></div>`}
function teamUI(){
 if(!rc)return `<div class="center card"><h2 class="logo">Tham gia</h2><p>Nhập mã phòng</p><input id="rcode" inputmode="numeric" placeholder="Mã phòng 4 số"><button class="btn lg" onclick="location.hash='team-'+$('#rcode').value">Tiếp tục</button></div>`;
 if(!S.room||S.phase==='setup')return `<div class="center card"><p>Phòng chưa mở. Chờ MC mở mã QR…</p></div>`;
 if(rc!==S.room)return `<div class="center card"><h3>Mã phòng không đúng hoặc phòng đã đóng</h3><p>Hãy quét lại mã QR trên màn hình.</p></div>`;
 if(!me)return `<div class="center" style="padding-top:8vh"><h1 class="logo">OLYMPIA</h1><div class="sub">PHÒNG ${esc(S.room)}</div><div class="card"><h3>Đặt tên đội của bạn</h3><input id="tname" maxlength="18" placeholder="Tên đội"><button class="btn lg" onclick="joinTeam()">VÀO PHÒNG</button><div id="jerr" style="color:var(--no)"></div></div></div>`;
 if(S.phase==='lobby')return `<div class="center" style="padding-top:12vh"><h2 class="logo">${nm(me)}</h2><span class="pill">Đội số ${me}</span><p class="big win" style="font-size:1.5rem">${ic('ok2')} Bạn đã vào phòng!</p><p style="color:var(--mut)">Chờ MC bắt đầu…</p>${bubbles()}</div>`;
 let st='WAITING',msg='Chờ MC mở chuông',dis=true;const w=buzzDoc&&buzzDoc.team;
 if(S.banned.includes(me)){st='ELIMINATED';msg='Bạn đã trả lời sai ở câu này'}
 else if(w===me||S.owner===me){st=S.owner===me?'ANSWERING':'BUZZED';msg='BẠN ĐÃ GIÀNH QUYỀN!'}
 else if(w){st='LOCKED';msg=(TN[w]||'Đội '+w)+' đã giành quyền'}
 else if(S.open){st='READY';msg='BẤM CHUÔNG!';dis=false}
 return `<div class="center" style="padding-top:4vh"><div class="sub">${nm(me)}</div><p style="font-weight:700;color:var(--mut)">${esc(msg)}</p><button class="bell" ${dis?'disabled':''} onclick="buzz()">${ic('bell')}</button></div>`}
function hid(){try{let h=localStorage.getItem('oid');if(!h){h='u'+Math.random().toString(36).slice(2,10);localStorage.setItem('oid',h)}return h}catch(e){return window._h||(window._h='u'+Math.random().toString(36).slice(2,10))}}
async function joinTeam(){const name=$('#tname').value.trim();if(!name){$('#jerr').textContent='Hãy nhập tên đội';return}
 for(let n=1;n<=4;n++){try{const r=await db.doc('teams/'+S.room+'_'+n).acquire({holder:hid(),ttlMs:600000,data:{name,n}});if(r.acquired){me=n;try{sessionStorage.setItem('tm'+S.room,n)}catch(e){}setInterval(()=>db.doc('teams/'+S.room+'_'+me).acquire({holder:hid(),ttlMs:600000,data:{name,n:me}}).catch(()=>{}),240000);beep(1200);return render()}}catch(e){}}
 $('#jerr').textContent='Phòng đã đủ 4 đội'}
async function buzz(){if(busy||!S.open||buzzDoc)return;busy=true;beep(1200,.2);
 try{const r=await db.doc('buzz/'+bkey()).acquire({holder:'team'+me,ttlMs:600000,data:{team:me,at:new Date().toISOString()}});if(r.acquired){beep(1500,.4);confetti()}}catch(e){}busy=false;render()}
function home(){const L=[...'OLYMPIA'].map((c,i)=>`<span style="--i:${i};--r:${[-5,3,-3,4,-4,3,-5][i]}deg;--c:${i%2?'#7aa75c':'#5d7f4a'}">${c}</span>`).join('');
 const lv=[[6,12,50,0],[88,18,36,1.2],[14,62,30,2],[80,58,56,.6],[48,6,26,2.4],[93,78,34,1.8],[4,84,42,3]].map(([x,y,z,d])=>`<i class="lf" style="left:${x}%;top:${y}%;width:${z}px;height:${z}px;animation-delay:${d}s"></i>`).join('');
 const sp=[[22,20],[74,10],[30,74],[66,70],[92,40],[8,44]].map(([x,y],i)=>`<b class="sp" style="left:${x}%;top:${y}%;animation-delay:${i*.4}s;color:${i%2?'#e9d49a':'#efb9c7'}">${ic('spark','f')}</b>`).join('');
 return `<div class="deco">${lv}${sp}</div><svg class="hills" viewBox="0 0 1440 260" preserveAspectRatio="none"><path d="M0 120C240 40 420 190 720 110S1200 30 1440 110V260H0Z" fill="#cfe6bf"/><path d="M0 190C300 110 520 250 820 170S1250 120 1440 180V260H0Z" fill="#b7d99f"/></svg>
 <div class="home"><svg class="bellm" viewBox="0 0 160 170"><path d="M80 22C52 22 40 48 40 78v26c0 8-10 14-14 22h108c-4-8-14-14-14-22V78c0-30-12-56-40-56z" fill="#8fbd74" stroke="#3f5a31" stroke-width="5" stroke-linejoin="round"/><rect x="22" y="122" width="116" height="14" rx="7" fill="#5d7f4a" stroke="#3f5a31" stroke-width="4"/><circle cx="80" cy="148" r="11" fill="#3f5a31"/><path d="M80 22c0-10 4-16 14-18-1 10-5 16-14 18z" fill="#a8cf8e" stroke="#3f5a31" stroke-width="3"/><ellipse cx="58" cy="52" rx="7" ry="14" fill="#fff" opacity=".4" transform="rotate(20 58 52)"/><g fill="#24331e"><circle cx="64" cy="82" r="6"/><circle cx="96" cy="82" r="6"/></g><path d="M70 96q10 10 20 0" fill="none" stroke="#24331e" stroke-width="4" stroke-linecap="round"/><ellipse cx="52" cy="96" rx="8" ry="5" fill="#ff9fb8" opacity=".8"/><ellipse cx="108" cy="96" rx="8" ry="5" fill="#ff9fb8" opacity=".8"/></svg>
 <h1 class="ttl">${L}</h1><div class="rib">THE PINK CHALLENGE</div>
 <div class="chips"><span class="chip"><em>${ic('book')}</em>Kiến thức</span><span class="chip c2"><em>${ic('zap')}</em>Tốc độ</span><span class="chip c3"><em>${ic('target')}</em>Chiến thuật</span></div>
 <div class="hb"><button class="hbtn" onclick="go('host')">${ic('leaf')} Tạo phòng (MC)</button><button class="hbtn alt" onclick="const c=prompt('Mã phòng:');if(c)go('team-'+c)">${ic('bell')} Vào phòng</button></div></div>`}
function go(r){location.hash=r}
function render(){
 const a=document.activeElement;if(a&&app.contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.type!=='checkbox')return;
 if(!db&&role){app.innerHTML='<p class="center">Đang kết nối…</p>';return}
 app.className='wrap r-'+(role||'home');app.innerHTML=!role?home():role==='host'?hostUI():role==='display'?displayUI():teamUI();
 drawQR();
 if(role==='display'||role==='team'){if(S.fx&&S.fx.id!==seenFx){seenFx=S.fx.id;beep(S.fx.k==='ok'?1000:200,.5);if(S.fx.k==='ok')confetti()}if(S.result&&role==='display')confetti()}
 const j=JSON.stringify(rank().map(r=>r.t));if(j!==lastScores&&role==='display'){lastScores=j;document.querySelectorAll('.score,.tile').forEach(e=>{e.classList.add('flash');setTimeout(()=>e.classList.remove('flash'),700)})}}
setInterval(()=>{const run=!!S.tEnd,m=run?Math.max(0,S.tEnd-Date.now()):S.tLeft||0,n=Math.ceil(m/1000),has=run||S.tLeft>0,qq=cq();
 [['#dt',S.show],['#ht',1]].forEach(([id,on])=>{const e=$(id);if(!e)return;e.textContent=has?n:(qq&&on?qq.time:'');e.classList.toggle('idle',!has);e.classList.toggle('low',run&&n<=5)})},200);
addEventListener('hashchange',()=>{const h=h0();role=h[0];rc=h[1]||'';me=null;tKey='';restoreMe();setupWatch();render()});
function restoreMe(){try{const v=+sessionStorage.getItem('tm'+rc);if(role==='team'&&v&&rc)me=v}catch(e){}}
(async()=>{restoreMe();render();
 if(FIREBASE_CONFIG.apiKey.startsWith('YOUR')){app.innerHTML='<div class="center card"><h2>Chưa cấu hình Firebase</h2><p>Mở index.html, dán cấu hình Firebase vào FIREBASE_CONFIG (xem README).</p></div>';return}
 db=makeDb();

 ref().onSnapshot(s=>{$('#warn').classList.add('hidden');window._got=1;if(s.exists)S=Object.assign(fresh(),s.data());if(role==='team'&&S.room&&rc===S.room)restoreMe();if(role==='host'&&!S.room&&(!window._mk||Date.now()-window._mk>4000)){window._mk=Date.now();save(x=>{x.room=String(Math.floor(1000+Math.random()*9000));x.phase='setup'})}setupWatch();render()},()=>$('#warn').classList.remove('hidden'));
 setupWatch();setTimeout(()=>{if(!window._got)app.innerHTML='<div class="center card"><h3>Không kết nối được Firebase</h3><p>Kiểm tra databaseURL và Rules (.read, .write = true).</p></div>'},8000)})();
</script></body></html>
