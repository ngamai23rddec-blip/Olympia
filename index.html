<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OLYMPIA – THE PINK CHALLENGE</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#eef6e6;--card:#fff;--ink:#24331e;--mut:#6f8264;--pk:#5d7f4a;--soft:#dfecd2;--line:#cfe0c0;--ok:#22b573;--no:#d9534f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17221a;--card:#22301f;--ink:#e9f5e1;--mut:#9db28f;--soft:#2f4429;--line:#3f5a36;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:radial-gradient(circle at 15% 10%,#d4e8c4,transparent 45%),radial-gradient(circle at 85% 30%,#e3f1d6,transparent 40%),radial-gradient(circle at 50% 100%,#cfe6bf,transparent 50%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:'Be Vietnam Pro',system-ui,sans-serif;min-height:100vh}
.wrap{max-width:1200px;margin:0 auto;padding:18px}.center{text-align:center}
.logo{font-weight:900;color:var(--pk);letter-spacing:1px;margin:.2em 0}
.sub{color:var(--mut);font-weight:700;letter-spacing:3px;font-size:.8rem}
.btn{background:var(--pk);color:#fff;border:0;border-radius:14px;padding:11px 18px;font:700 .95rem inherit;font-family:inherit;cursor:pointer;margin:4px;box-shadow:0 4px 0 #3f5a31;transition:.12s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #3f5a31}
.btn.alt{background:var(--card);color:var(--pk);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 #168a58}.btn.no{background:var(--no);box-shadow:0 4px 0 #a83a37}
.btn:disabled{opacity:.35;pointer-events:none}.btn.lg{font-size:1.2rem;padding:16px 34px}
.card{background:color-mix(in srgb,var(--card) 78%,transparent);backdrop-filter:blur(10px);border:1px solid #ffffffaa;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 6px 24px #5d7f4a1f}
input,select,textarea{font:inherit;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px;width:100%;margin:3px 0;outline:0}
input:focus,textarea:focus,select:focus{border-color:var(--pk)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.score{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;background:var(--soft);margin:5px 0;transition:.4s}
.score.flash{background:var(--pk);color:#fff;transform:scale(1.03)}
.pill{display:inline-block;padding:4px 14px;border-radius:99px;background:var(--soft);color:var(--pk);font-weight:700;font-size:.85rem}
.big{font-size:clamp(1.4rem,4vw,2.8rem);font-weight:900}
.code{font-size:clamp(3rem,10vw,6rem);font-weight:900;color:var(--pk);letter-spacing:.15em}
.bubbles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.bub{background:var(--pk);color:#fff;border-radius:99px;padding:10px 22px;font-weight:900;font-size:1.2rem;animation:pop .5s}
.bub.empty{background:var(--soft);color:var(--mut);animation:none}
.bell{width:min(76vw,52vh);height:min(76vw,52vh);border-radius:50%;border:0;background:var(--pk);color:#fff;font-size:4rem;box-shadow:0 12px 0 #3f5a31,0 0 60px #5d7f4a8a;animation:pulse 1.5s infinite;cursor:pointer}
.bell:active{transform:translateY(8px);box-shadow:0 4px 0 #3f5a31}
.bell:disabled{background:#cfd8c8;box-shadow:0 12px 0 #aab8a2;animation:none}
@keyframes pulse{50%{transform:scale(1.04)}}@keyframes pop{from{transform:scale(.3);opacity:0}}
.timer{display:inline-grid;place-items:center;min-width:120px;height:120px;border-radius:50%;background:var(--pk);color:#fff;font-size:3.4rem;font-weight:900;margin:10px;padding:0 14px}
.win{animation:pop .5s}.hidden{display:none}.star{font-size:2.6rem;animation:pulse .8s infinite}
.warn{background:var(--no);color:#fff;padding:6px;text-align:center;font-weight:700}
.q-img{max-width:60%;max-height:30vh;border-radius:16px}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:9}
#qr{display:inline-block;background:#fff;padding:14px;border-radius:20px;box-shadow:0 6px 24px #5d7f4a33}
.shell{display:grid;grid-template-columns:210px 1fr;gap:16px}.side{background:color-mix(in srgb,var(--card) 78%,transparent);backdrop-filter:blur(10px);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:4px;align-self:start;position:sticky;top:12px}
.nav{border:0;background:none;text-align:left;padding:10px 12px;border-radius:12px;font:inherit;font-weight:700;color:var(--ink);cursor:pointer}.nav.on{background:var(--soft);color:var(--pk)}
.brand{font-weight:900;color:var(--pk);font-size:1.25rem;margin-bottom:10px}.brand small{display:block;font-size:.6rem;color:var(--mut);letter-spacing:2px}.stat .big{color:var(--pk)}
@media(max-width:760px){.shell{grid-template-columns:1fr}.side{flex-direction:row;flex-wrap:wrap;position:static}}
</style></head><body>
<div id="warn" class="warn hidden">Mất kết nối – đang kết nối lại…</div>
<canvas id="cf"></canvas><div id="app" class="wrap"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const BASE=location.origin+location.pathname;
// ===== DÁN CẤU HÌNH FIREBASE CỦA BẠN VÀO ĐÂY =====
const FIREBASE_CONFIG={apiKey:'YOUR_API_KEY',authDomain:'YOUR_PROJECT.firebaseapp.com',databaseURL:'https://YOUR_PROJECT-default-rtdb.firebaseio.com',projectId:'YOUR_PROJECT',appId:'YOUR_APP_ID'};
function makeDb(){firebase.initializeApp(FIREBASE_CONFIG);const rdb=firebase.database();
 const rf=p=>{const a=p.split('/');return rdb.ref(a[0]+'/'+a.slice(1).join('__'))};
 const wrap=s=>({exists:s.exists(),data:()=>s.val()});
 return{doc(p){const r=rf(p);return{get:async()=>wrap(await r.get()),set:v=>r.set(v),
  onSnapshot:(cb,er)=>{const f=r.on('value',s=>cb(wrap(s)),er);return()=>r.off('value',f)},
  acquire:async o=>{let won=false;await r.transaction(c=>{if(c===null||c.holder===o.holder||c.exp<Date.now()){won=true;return Object.assign({},o.data,{holder:o.holder,exp:Date.now()+o.ttlMs})}return});return{acquired:won}}}},
 collection(n){const r=rdb.ref(n);return{onSnapshot:(cb,er)=>{const f=r.on('value',s=>{const docs=[];s.forEach(c=>{docs.push({id:c.key,exists:true,data:()=>c.val()})});cb({docs})},er);return()=>r.off('value',f)}}}}}

const MODES={heat1:'Vòng loại – Lượt 1 (Đội 1–4)',heat2:'Vòng loại – Lượt 2 (Đội 5–8)',final1:'Chung kết – Đấu trường tri thức',final2:'Chung kết – Về đích'};
const TYPES=['Multiple Choice','Fill in the Blanks','Short Answer','True or False','Sentence Correction','Khác'];
const NOSTEAL=['Multiple Choice','True or False'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fresh=()=>({room:'',phase:'setup',mode:'heat1',qs:[],qi:-1,show:false,ans:false,open:false,seq:0,owner:null,banned:[],tEnd:0,tLeft:0,star:false,reset0:true,scores:Object.fromEntries([1,2,3,4,5,6,7,8].map(i=>[i,{h:0,f1:0,f2:0}])),fin:[],log:[],fx:null,result:false});
let S=fresh(),db=null,me=null,TN={},snd=true,buzzDoc=null,unsubB=null,curKey='',unsubT=null,tKey='',busy=false,seenFx=0,lastScores='';
const h0=()=>(location.hash||'').slice(1).split('-');let role=h0()[0],rc=h0()[1]||'';
const nm=i=>esc(TN[i]||('Đội '+i));
const ref=()=>db.doc('host/state');let q=Promise.resolve();
function save(fn){if(fn)fn(S);q=q.then(()=>ref().set(JSON.parse(JSON.stringify(S)))).catch(e=>alert('Không ghi được dữ liệu (cần quyền Editor/Owner cho MC): '+(e.message||e.code)));render()}
function beep(f=880,d=.15){if(!snd)return;try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.value=.15;o.start();o.stop(c.currentTime+d)}catch(e){}}
function confetti(){const c=$('#cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const P=[...Array(160)].map(()=>({x:Math.random()*c.width,y:-20,v:2+Math.random()*5,r:4+Math.random()*6,c:['#5d7f4a','#a8cf8e','#ffd166','#ffb3d6','#9ad1e6'][Math.floor(Math.random()*5)]}));let n=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.r,p.r*1.6)});if(n++<300)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}
const tot=t=>S.mode.startsWith('final')?t.f1+t.f2+(S.reset0?0:t.h):t.h;
const bucket=()=>S.mode.startsWith('heat')?'h':S.mode==='final1'?'f1':'f2';
const teamsIn=()=>S.mode==='heat1'?[1,2,3,4]:S.mode==='heat2'?[5,6,7,8]:S.fin.length?S.fin:[1,2,3,4,5,6,7,8];
const cq=()=>S.qs.filter(x=>x.m===S.mode)[S.qi];
const rank=()=>teamsIn().map(i=>({i,...S.scores[i],t:tot(S.scores[i])})).sort((a,b)=>b.t-a.t);
const bkey=()=>'b'+S.room+'_'+S.seq;
function setupWatch(){
  if(!db)return;
  if(curKey!==bkey()){curKey=bkey();if(unsubB)unsubB();buzzDoc=null;
    unsubB=db.doc('buzz/'+curKey).onSnapshot(s=>{buzzDoc=s.exists?s.data():null;if(buzzDoc&&role==='host'&&S.open&&!S.owner){save(x=>{x.owner=buzzDoc.team;x.open=false;x.tLeft=(cq()?.time||15)*1000;x.tEnd=Date.now()+x.tLeft})}render()},()=>{})}
  const code=role==='team'?rc:S.room;
  if(code&&tKey!==code){tKey=code;if(unsubT)unsubT();
    unsubT=db.collection('teams').onSnapshot(s=>{const t={};s.docs.forEach(d=>{const m=d.id.match(/^(\d+)_(\d)$/);if(m&&m[1]===code&&d.exists)t[+m[2]]=d.data().name});TN=t;render()},()=>{})}}
function apply(ok){const o=S.owner,qq=cq();if(!o||!qq)return;const b=bucket(),stealing=S.banned.length>0;let d=0,e=null;
  if(S.mode==='final2'){const p=qq.pts*((S.star&&!stealing)?2:1);if(ok){d=stealing?qq.pts:p;if(stealing)e=[S.banned[S.banned.length-1],-qq.pts]}else d=stealing?-qq.pts/2:-p}
  else d=ok?(stealing?10:20):-10;
  const tg=[[o,d]];if(e)tg.push(e);
  save(x=>{tg.forEach(([t,v])=>{x.scores[t][b]+=v});
    x.log.unshift({t:new Date().toLocaleTimeString('vi-VN'),q:x.qi+1,team:o,ok,d,steal:stealing});
    x.fx={k:ok?'ok':'no',team:o,d,id:Date.now()};
    if(ok){x.open=false;x.owner=null;x.show=true;x.ans=true;x.tEnd=0}else{x.banned.push(o);x.owner=null;x.tEnd=0;x.open=false}})}
const A={
 openB(){save(x=>{x.seq++;x.open=true;x.owner=null})},closeB(){save(x=>{x.open=false})},
 reopen(){const qq=cq();if(qq&&NOSTEAL.includes(qq.type))return alert('Câu này không cho cướp quyền');save(x=>{x.seq++;x.open=true;x.owner=null})},
 next(){save(x=>{x.qi++;x.show=true;x.ans=false;x.open=false;x.owner=null;x.banned=[];x.seq++;x.tEnd=0;x.tLeft=0;x.star=false;x.fx=null})},
 start(){const qq=cq();save(x=>{x.tLeft=x.tLeft||(qq?.time||15)*1000;x.tEnd=Date.now()+x.tLeft})},
 pause(){save(x=>{if(x.tEnd){x.tLeft=Math.max(0,x.tEnd-Date.now());x.tEnd=0}})},
 resetT(){const qq=cq();save(x=>{x.tEnd=0;x.tLeft=(qq?.time||15)*1000})},
 showAns(){save(x=>{x.ans=true})},correct(){apply(true)},wrong(){apply(false)},star(){save(x=>{x.star=!x.star})}};
function adj(t){const n=prompt('Điều chỉnh điểm '+(TN[t]||'Đội '+t)+' (số âm để trừ):');if(n===null||isNaN(+n))return;const r=prompt('Lý do?')||'';save(x=>{x.scores[t][bucket()]+=+n;x.log.unshift({t:new Date().toLocaleTimeString('vi-VN'),manual:true,team:t,d:+n,why:r})})}
function finalists(){const f=[];[[1,2,3,4],[5,6,7,8]].forEach(ids=>ids.map(i=>({i,s:S.scores[i].h})).sort((a,b)=>b.s-a.s).slice(0,2).forEach(z=>f.push(z.i)));save(x=>{x.fin=f;x.mode='final1';x.qi=-1;x.show=false;x.seq++})}
async function addQ(){const f=$('#qf').files[0];let img=$('#qi').value;if(f){img=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,600/im.width);c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.7))};im.src=fr.result};fr.readAsDataURL(f)})}
 const t=$('#qt').value.trim();if(!t)return;const type=$('#qty').value;
 save(x=>x.qs.push({m:x.mode,t,type,a:$('#qa').value,ex:$('#qe').value,pts:+$('#qp').value||10,time:+$('#qtm').value||15,steal:!NOSTEAL.includes(type),img}))}
function mv(i,d){save(x=>{const j=i+d;if(j<0||j>=x.qs.length)return;[x.qs[i],x.qs[j]]=[x.qs[j],x.qs[i]]})}
function delQ(i){if(confirm('Xóa câu này?'))save(x=>x.qs.splice(i,1))}
function editQ(i){const t=prompt('Sửa nội dung:',S.qs[i].t);if(t===null)return;const a=prompt('Sửa đáp án:',S.qs[i].a);save(x=>{x.qs[i].t=t;x.qs[i].a=a??x.qs[i].a})}
function bubbles(){return `<div class="bubbles">${[1,2,3,4,5,6,7,8].map(i=>TN[i]?`<span class="bub">${i}. ${nm(i)}</span>`:`<span class="bub empty">Đội ${i}</span>`).join('')}</div>`}
const joinUrl=()=>BASE+'#team-'+S.room;
function drawQR(){const e=$('#qr');if(!e||!window.QRCode||e.dataset.u===joinUrl())return;e.innerHTML='';e.dataset.u=joinUrl();new QRCode(e,{text:joinUrl(),width:220,height:220,correctLevel:QRCode.CorrectLevel.M})}
function lobbyCard(big){return `<div class="card center"><div class="sub">QUÉT MÃ QR ĐỂ THAM GIA</div><div id="qr" style="margin:12px"></div><div class="sub">MÃ PHÒNG</div><div class="code">${S.room}</div>${bubbles()}<div class="sub">${Object.keys(TN).length}/8 ĐỘI ĐÃ VÀO</div></div>`}
function qForm(){return `<div class="card"><h3>Thêm câu hỏi · ${MODES[S.mode]}</h3><textarea id="qt" rows="2" placeholder="Nội dung câu hỏi (trắc nghiệm: ghi kèm A/B/C/D)"></textarea>
 <div class="grid"><select id="qty">${TYPES.map(t=>`<option>${t}</option>`)}</select><input id="qa" placeholder="Đáp án chính xác"><input id="qe" placeholder="Lời giải thích"><input id="qp" type="number" value="10" placeholder="Điểm (Về đích)"><input id="qtm" type="number" value="15" placeholder="Giây"><input id="qi" placeholder="URL hình ảnh"><input id="qf" type="file" accept="image/*"></div>
 <button class="btn" onclick="addQ()">Thêm câu hỏi</button></div>`}
let tab='over';
function setTab(t){tab=t;render()}
const stat=(n,l)=>`<div class="card stat"><div class="big">${n}</div><div style="color:var(--mut)">${l}</div></div>`;
function ctlTab(){const qq=cq(),mq=S.qs.filter(x=>x.m===S.mode);
 if(S.phase!=='play')return `<div class="card center"><h3>Chưa bắt đầu thi</h3><p>Hãy mở mã QR cho các đội vào, rồi bấm BẮT ĐẦU ở mục Tổng quan.</p></div>`;
 const st=S.owner?`🔔 ${nm(S.owner)} giành quyền`:S.open?'Chuông ĐANG MỞ':'Chuông đóng';
 return `<div class="card"><h3>Câu ${S.qi+1}/${mq.length}: ${qq?esc(qq.t):'(chưa bắt đầu)'}</h3>${qq?`<div class="pill">${qq.type} · ${qq.pts}đ · ${qq.time}s · cướp: ${qq.steal?'có':'không'}</div><p><b>Đáp án:</b> ${esc(qq.a)} — ${esc(qq.ex)}</p>`:''}
 <div class="big">${st}</div><div id="ht" class="timer"></div><br>
 <button class="btn" onclick="A.openB()">OPEN BUZZER</button><button class="btn alt" onclick="A.closeB()">CLOSE BUZZER</button><button class="btn" onclick="A.start()">START TIMER</button><button class="btn alt" onclick="A.pause()">PAUSE TIMER</button><button class="btn alt" onclick="A.resetT()">RESET TIMER</button>
 <button class="btn ok" onclick="A.correct()" ${S.owner?'':'disabled'}>CORRECT</button><button class="btn no" onclick="A.wrong()" ${S.owner?'':'disabled'}>WRONG</button><button class="btn alt" onclick="A.showAns()">SHOW ANSWER</button><button class="btn alt" onclick="A.reopen()">REOPEN BUZZER</button><button class="btn" onclick="A.next()">NEXT QUESTION</button>
 ${S.mode==='final2'?`<button class="btn alt" onclick="A.star()">⭐ Ngôi sao: ${S.star?'ĐANG DÙNG':'tắt'}</button>`:''}</div>
 <div class="card"><h3>Điểm nhanh</h3>${rank().map(r=>`<div class="score"><span>${nm(r.i)}</span><b>${r.t}</b></div>`).join('')}</div>`}
function hostUI(){
 if(!S.room)return '<p class="center">Đang tạo phòng…</p>';
 const nav=[['over','Tổng quan','▦'],['qs','Câu hỏi','✎'],['room','Phòng & QR','◎'],['ctl','Điều khiển','▶'],['sc','Bảng điểm','★']];
 const side=`<aside class="side"><div class="brand">OLYMPIA<small>THE PINK CHALLENGE</small></div>${nav.map(([k,l,i])=>`<button class="nav ${tab===k?'on':''}" onclick="setTab('${k}')">${i} ${l}</button>`).join('')}<button class="nav" onclick="snd=!snd">♪ Âm thanh</button></aside>`;
 const mq=S.qs.filter(x=>x.m===S.mode);let body='';
 if(tab==='over')body=`<div class="card"><h2 class="logo" style="margin:0">Bảng điều phối</h2><div class="sub">THIẾT LẬP TRƯỚC KHI THI</div></div>
 <div class="grid">${stat(S.room,'Mã phòng')}${stat(Object.keys(TN).length+'/8','Đội đã vào')}${stat(mq.length,'Câu hỏi của phần này')}${stat(S.phase==='setup'?'Soạn':S.phase==='lobby'?'Đang mở QR':'Đang thi','Trạng thái')}</div>
 <div class="card"><h3>Các bước</h3>
 <div class="score"><span>1. Soạn câu hỏi</span><button class="btn alt" onclick="setTab('qs')">Mở</button></div>
 <div class="score"><span>2. Mở mã QR cho các đội vào</span><button class="btn" onclick="save(x=>x.phase='lobby');setTab('room')">Mở QR</button></div>
 <div class="score"><span>3. Bắt đầu thi (đội chỉ còn nút chuông)</span><button class="btn" onclick="save(x=>x.phase='play');setTab('ctl')">BẮT ĐẦU</button></div></div>
 <div class="card"><h3>Thiết lập</h3><select onchange="save(x=>{x.mode=this.value;x.qi=-1;x.show=false;x.open=false;x.owner=null;x.banned=[];x.seq++})">${Object.entries(MODES).map(([k,v])=>`<option value="${k}" ${S.mode===k?'selected':''}>${v}</option>`)}</select>
 <label><input type="checkbox" style="width:auto" ${S.reset0?'checked':''} onchange="save(x=>x.reset0=this.checked)"> Chung kết bắt đầu lại từ 0 điểm (khuyến nghị)</label><br>
 <button class="btn alt" onclick="finalists()">Xác định 4 đội chung kết</button><button class="btn alt" onclick="save(x=>x.result=!x.result);confetti()">Công bố kết quả</button><button class="btn no" onclick="if(confirm('RESET ROOM? Giữ câu hỏi, xóa điểm và đội, tạo mã phòng mới.'))save(x=>Object.assign(x,fresh(),{qs:x.qs,room:String(Math.floor(1000+Math.random()*9000))}))">RESET ROOM</button></div>`;
 else if(tab==='qs')body=qForm()+`<div class="card"><h3>Câu hỏi (${mq.length})</h3>${S.qs.map((x,i)=>x.m!==S.mode?'':`<div class="score"><span>${x.type} · ${x.pts}đ · ${esc(x.t.slice(0,60))}</span><span><button class="btn alt" onclick="mv(${i},-1)">↑</button><button class="btn alt" onclick="mv(${i},1)">↓</button><button class="btn alt" onclick="editQ(${i})">Sửa</button><button class="btn no" onclick="delQ(${i})">Xóa</button></span></div>`).join('')||'Chưa có câu hỏi'}</div>`;
 else if(tab==='room')body=`<div class="center">${lobbyCard()}<button class="btn" onclick="save(x=>x.phase=(x.phase==='setup'?'lobby':x.phase))">Hiện QR trên màn chiếu</button><button class="btn alt" onclick="window.open(BASE+'#display','_blank')">Mở Public Display</button></div>`;
 else if(tab==='ctl')body=ctlTab();
 else body=`<div class="card"><h3>Bảng điểm</h3>${rank().map(r=>`<div class="score"><span>${r.i}. ${nm(r.i)}</span><span>V1 ${r.h} · CK1 ${r.f1} · CK2 ${r.f2} · <b>${r.t}</b> <button class="btn alt" onclick="adj(${r.i})">±</button></span></div>`).join('')}</div><div class="card"><h3>Lịch sử</h3><div style="max-height:320px;overflow:auto;font-size:.85em">${S.log.map(l=>l.manual?`${l.t} Chỉnh tay ${nm(l.team)}: ${l.d} (${esc(l.why)})`:`${l.t} Câu ${l.q} ${nm(l.team)} ${l.ok?'ĐÚNG':'SAI'} ${l.d>0?'+':''}${l.d}${l.steal?' (cướp)':''}`).join('<br>')}</div></div>`;
 return `<div class="shell">${side}<main>${body}</main></div>`}
function displayUI(){
 if(!S.room||S.phase==='setup')return `<div class="center" style="padding-top:20vh"><h1 class="logo" style="font-size:clamp(2.2rem,8vw,5rem)">OLYMPIA</h1><div class="sub">THE PINK CHALLENGE · KNOWLEDGE – SPEED – STRATEGY</div><p style="color:var(--mut)">MC đang chuẩn bị…</p></div>`;
 if(S.phase==='lobby')return `<div class="center"><h1 class="logo" style="font-size:clamp(1.8rem,5vw,3.4rem)">OLYMPIA · THE PINK CHALLENGE</h1>${lobbyCard()}</div>`;
 const qq=cq(),r=rank();
 if(S.result){const med=['🥇 QUÁN QUÂN','🥈 Á QUÂN','🥉 Hạng ba','Hạng tư'];return `<div class="center win"><h1 class="logo big">OLYMPIA · THE PINK CHALLENGE</h1>${r.map((x,i)=>`<div class="card big">${med[i]||''} ${nm(x.i)} — ${x.t} điểm</div>`).join('')}</div>`}
 return `<div class="center"><h1 class="logo" style="font-size:clamp(1.4rem,3.5vw,2.4rem)">OLYMPIA · THE PINK CHALLENGE</h1><span class="pill">${MODES[S.mode]}</span></div>
 <div class="card center">${qq&&S.show?`<div class="pill">Câu ${S.qi+1} · ${qq.type} · ${qq.pts} điểm</div><div class="big" style="margin:14px 0">${esc(qq.t)}</div>${qq.img?`<img class="q-img" src="${esc(qq.img)}">`:''}${S.ans?`<div class="big" style="color:var(--ok)">ĐÁP ÁN: ${esc(qq.a)}</div><div>${esc(qq.ex)}</div>`:''}`:'<div class="big">Chuẩn bị…</div>'}
 <div><span id="dt" class="timer"></span></div>
 ${S.star?'<div class="star">⭐ NGÔI SAO HY VỌNG ×2</div>':''}
 ${S.owner?`<div class="big win" style="color:var(--pk)">🔔 ${nm(S.owner)} GIÀNH QUYỀN TRẢ LỜI!</div>`:S.open?'<div class="big" style="color:var(--pk)">CHUÔNG ĐÃ MỞ!</div>':''}
 ${S.fx?`<div class="big win" style="color:${S.fx.k==='ok'?'var(--ok)':'var(--no)'}">${S.fx.k==='ok'?'✔ ĐÚNG':'✘ SAI'} ${S.fx.d>0?'+':''}${S.fx.d} · ${nm(S.fx.team)}</div>`:''}</div>
 <div class="grid">${r.map((x,i)=>`<div class="score"><span>#${i+1} ${nm(x.i)}</span><b class="big" style="font-size:1.6rem">${x.t}</b></div>`).join('')}</div>
 <div class="center"><button class="btn alt" onclick="document.documentElement.requestFullscreen()">Toàn màn hình</button><button class="btn alt" onclick="snd=!snd">Âm thanh</button></div>`}
function teamUI(){
 if(!rc)return `<div class="center card"><h2 class="logo">Tham gia</h2><p>Nhập mã phòng</p><input id="rcode" inputmode="numeric" placeholder="Mã phòng 4 số"><button class="btn lg" onclick="location.hash='team-'+$('#rcode').value">Tiếp tục</button></div>`;
 if(!S.room||S.phase==='setup')return `<div class="center card"><p>Phòng chưa mở. Chờ MC mở mã QR…</p></div>`;
 if(rc!==S.room)return `<div class="center card"><h3>Mã phòng không đúng hoặc phòng đã đóng</h3><p>Hãy quét lại mã QR trên màn hình.</p></div>`;
 if(!me)return `<div class="center" style="padding-top:8vh"><h1 class="logo">OLYMPIA</h1><div class="sub">PHÒNG ${esc(S.room)}</div><div class="card"><h3>Đặt tên đội của bạn</h3><input id="tname" maxlength="18" placeholder="Tên đội"><button class="btn lg" onclick="joinTeam()">VÀO PHÒNG</button><div id="jerr" style="color:var(--no)"></div></div></div>`;
 if(S.phase==='lobby')return `<div class="center" style="padding-top:12vh"><h2 class="logo">${nm(me)}</h2><span class="pill">Đội số ${me}</span><p class="big win" style="font-size:1.5rem">Bạn đã vào phòng! 🎉</p><p style="color:var(--mut)">Chờ MC bắt đầu…</p>${bubbles()}</div>`;
 let st='WAITING',msg='Chờ MC mở chuông',dis=true;const w=buzzDoc&&buzzDoc.team;
 if(S.banned.includes(me)){st='ELIMINATED';msg='Bạn đã trả lời sai ở câu này'}
 else if(w===me||S.owner===me){st=S.owner===me?'ANSWERING':'BUZZED';msg='YOU GOT THE BUZZER!'}
 else if(w){st='LOCKED';msg=(TN[w]||'Đội '+w)+' đã giành quyền'}
 else if(S.open){st='READY';msg='BẤM CHUÔNG!';dis=false}
 return `<div class="center" style="padding-top:4vh"><div class="sub">${nm(me)}</div><p style="font-weight:700;color:var(--mut)">${esc(msg)}</p><button class="bell" ${dis?'disabled':''} onclick="buzz()">🔔</button></div>`}
function hid(){try{let h=localStorage.getItem('oid');if(!h){h='u'+Math.random().toString(36).slice(2,10);localStorage.setItem('oid',h)}return h}catch(e){return window._h||(window._h='u'+Math.random().toString(36).slice(2,10))}}
async function joinTeam(){const name=$('#tname').value.trim();if(!name){$('#jerr').textContent='Hãy nhập tên đội';return}
 for(let n=1;n<=8;n++){try{const r=await db.doc('teams/'+S.room+'_'+n).acquire({holder:hid(),ttlMs:600000,data:{name,n}});if(r.acquired){me=n;try{sessionStorage.setItem('tm'+S.room,n)}catch(e){}setInterval(()=>db.doc('teams/'+S.room+'_'+me).acquire({holder:hid(),ttlMs:600000,data:{name,n:me}}).catch(()=>{}),240000);beep(1200);return render()}}catch(e){}}
 $('#jerr').textContent='Phòng đã đủ 8 đội'}
async function buzz(){if(busy||!S.open||buzzDoc)return;busy=true;beep(1200,.2);
 try{const r=await db.doc('buzz/'+bkey()).acquire({holder:'team'+me,ttlMs:600000,data:{team:me,at:new Date().toISOString()}});if(r.acquired){beep(1500,.4);confetti()}}catch(e){}busy=false;render()}
function home(){return `<div class="center" style="padding-top:8vh"><h1 class="logo" style="font-size:clamp(2.4rem,9vw,5.5rem);line-height:1">OLYMPIA</h1><div class="sub">THE PINK CHALLENGE</div><p style="color:var(--pk);font-weight:900;letter-spacing:3px">KNOWLEDGE – SPEED – STRATEGY</p>
 <button class="btn lg" onclick="go('host')">CREATE ROOM / HOST</button><button class="btn lg alt" onclick="const c=prompt('Mã phòng:');if(c)go('team-'+c)">JOIN ROOM</button><button class="btn alt" onclick="go('display')">PUBLIC DISPLAY</button>
 <details class="card" style="max-width:640px;margin:22px auto;text-align:left"><summary><b>Luật chơi</b></summary><p>Vòng loại: 2 lượt × 11 câu; đúng +20, sai −10; cướp quyền đúng +10, sai −10 (trắc nghiệm & đúng/sai không cướp). Top 2 mỗi lượt vào chung kết.</p><p>Chung kết V1 như vòng loại. V2 Về đích: gói A–D (10/20 điểm), cướp sai trừ một nửa, Ngôi sao hy vọng ×2 (dùng 1 lần).</p></details></div>`}
function go(r){location.hash=r}
function render(){
 const a=document.activeElement;if(a&&app.contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.type!=='checkbox')return;
 if(!db&&role){app.innerHTML='<p class="center">Đang kết nối…</p>';return}
 app.innerHTML=!role?home():role==='host'?hostUI():role==='display'?displayUI():teamUI();
 drawQR();
 if(role==='display'||role==='team'){if(S.fx&&S.fx.id!==seenFx){seenFx=S.fx.id;beep(S.fx.k==='ok'?1000:200,.5);if(S.fx.k==='ok')confetti()}if(S.result&&role==='display')confetti()}
 const j=JSON.stringify(rank().map(r=>r.t));if(j!==lastScores&&role==='display'){lastScores=j;document.querySelectorAll('.score').forEach(e=>{e.classList.add('flash');setTimeout(()=>e.classList.remove('flash'),700)})}}
setInterval(()=>{const m=S.tEnd?Math.max(0,S.tEnd-Date.now()):S.tLeft||0;['#dt','#ht'].forEach(s=>{const e=$(s);if(e)e.textContent=(S.tEnd||S.tLeft)?Math.ceil(m/1000):''})},200);
addEventListener('hashchange',()=>{const h=h0();role=h[0];rc=h[1]||'';me=null;tKey='';restoreMe();setupWatch();render()});
function restoreMe(){try{const v=+sessionStorage.getItem('tm'+rc);if(role==='team'&&v&&rc)me=v}catch(e){}}
(async()=>{restoreMe();render();
 if(FIREBASE_CONFIG.apiKey.startsWith('YOUR')){app.innerHTML='<div class="center card"><h2>Chưa cấu hình Firebase</h2><p>Mở index.html, dán cấu hình Firebase vào FIREBASE_CONFIG (xem README).</p></div>';return}
 db=makeDb();
 ref().get().then(s=>{if(!s.exists&&role==='host')save()}).catch(()=>{});
 ref().onSnapshot(s=>{$('#warn').classList.add('hidden');if(s.exists)S=Object.assign(fresh(),s.data());if(role==='team'&&S.room&&rc===S.room)restoreMe();if(role==='host'&&!S.room&&!window._mk){window._mk=1;save(x=>{x.room=String(Math.floor(1000+Math.random()*9000));x.phase='setup'})}setupWatch();render()},()=>$('#warn').classList.remove('hidden'));
 setupWatch()})();
</script></body></html>
